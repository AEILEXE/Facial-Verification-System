<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Verification | FANSC Verification System</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-5.3.2/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons-1.11.3/font/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="login-bg p-3">
  <div class="w-100" style="max-width:520px; margin:0 auto;">
    <div class="login-card card">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-3">Face Verification</h4>
        <p class="text-muted mb-4">
          Upload a face photo to complete biometric verification for dashboard access.
          This step is separate from login and keeps FaceNet work outside the login request cycle.
        </p>

        <form id="faceVerifyForm" method="POST" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="faceImageInput">Face Image</label>
            <input type="file" id="faceImageInput" class="form-control" name="image" accept="image/*" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-camera-video me-1"></i> Verify Face
          </button>
        </form>

        <div id="result" class="mt-4"></div>

        <div class="mt-3 text-muted small">
          After successful face verification you will be redirected to the dashboard.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('faceVerifyForm');
const resultNode = document.getElementById('result');
form.addEventListener('submit', async event => {
  event.preventDefault();
  resultNode.innerHTML = '';

  const formData = new FormData(form);

  try {
    const response = await fetch(window.location.href, {
      method: 'POST',
      body: formData,
      credentials: 'same-origin',
    });
    const data = await response.json();

    if (data.success) {
      resultNode.innerHTML = `
        <div class="alert alert-success">
          <i class="bi bi-check-circle-fill"></i>
          Face verified successfully. Redirecting...
        </div>
      `;
      const redirectUrl = data.redirect || '/dashboard/';
      window.setTimeout(() => window.location.assign(redirectUrl), 1200);
      return;
    }

    resultNode.innerHTML = `
      <div class="alert alert-danger">
        <i class="bi bi-x-circle-fill"></i>
        ${data.error || 'Face verification failed. Please try again.'}
      </div>
    `;
  } catch (err) {
    resultNode.innerHTML = `
      <div class="alert alert-danger">
        <i class="bi bi-x-circle-fill"></i>
        Unexpected error while verifying your face. Please try again.
      </div>
    `;
    console.error(err);
  }
});
</script>
</body>
</html>
